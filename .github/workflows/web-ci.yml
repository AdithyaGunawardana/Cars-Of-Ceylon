name: Web CI

on:
  # No `paths:` filter: web-quality and web-integration are *required* status checks, and a workflow that never
  # starts leaves a required check pending forever (docs-only or mobile-only PRs would be unmergeable).
  # Instead the `changes` job decides, and a job skipped by `if:` counts as passing for required checks.
  pull_request:
  push:
    # `development` is the integration branch; `main` only receives it at release time.
    branches:
      - main
      - development

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.diff.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did web/ or this workflow change?
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            range="${base}..${{ github.sha }}"
          fi
          # New branches report an all-zero "before" sha, and force pushes can leave it unknown: run everything.
          if [ -z "$base" ] || echo "$base" | grep -qE '^0+$' || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            web=true
          elif git diff --name-only "$range" | grep -qE '^(web/|\.github/workflows/web-ci\.yml$)'; then
            web=true
          else
            web=false
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "web changed: $web"

  web-quality:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Keep fast feedback focused on code health and API regression coverage.
      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test

      # The build imports route modules, and src/lib/prisma.ts requires DATABASE_URL at import time.
      # No connection is made during the build, so a placeholder is enough.
      - name: Run build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/build_placeholder

  # Real Postgres + MinIO: route-handler integration tests and Playwright browser tests.
  web-integration:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      INTEGRATION_S3_ENDPOINT: http://localhost:9000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The upstream minio/minio images are no longer published (Docker Hub and quay.io); the project is archived.
      # The Bitnami legacy mirror keeps the last build, pinned here so CI cannot drift. The image starts the server
      # itself, so no command is passed.
      - name: Start MinIO
        working-directory: .
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            bitnamilegacy/minio:2025.7.23-debian-12-r5
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become healthy" && docker logs minio && exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run integration tests
        run: npm run test:integration

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
